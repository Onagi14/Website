<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Event Management Portal</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> <!-- Added Font Awesome for icons -->
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="logo">
                <img src="logo.png" alt="Event Management Logo">
            </div>
            <h2>Admin Account</h2>
            <p>Please login to your account</p>
            <form id="adminloginForm">
                <div class="input-group">
                    <i class="fas fa-envelope"></i> <!-- Email Icon -->
                    <input type="email" id="email" name="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i> <!-- Password Icon -->
                    <input type="password" id="password" name="password" placeholder="Password" required>
                    <button type="button" id="togglePassword" onclick="togglePasswordVisibility()">
                        <i class="fas fa-eye" id="eyeIcon"></i> <!-- Eye Icon for toggling -->
                    </button>
                </div>
                <div class="actions">
                    <button type="submit" class="btn">Login</button>
                </div>
                <p class="register-link">Don't have an account? <a href="adminsignup.html">Sign up here</a></p>
                <p class="forgot-password-link"><a href="forgotadminpassword.html">Forgot Password?</a></p>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('adminloginForm').addEventListener('submit', function (event) {
            event.preventDefault(); // Prevent default form submission
    
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
    
            // Debug: Log form data to check
            console.log('Login form data:', { email, password });
    
            fetch('https://website-i6to.onrender.com/adminlogin', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(data.error); // Show error message
                } else {
                    alert(data.message); // Show success message
    
                    // Save token in localStorage for future requests
                    localStorage.setItem('token', data.token);
    
                    // Redirect to admin dashboard
                    window.location.href = 'dashboard.html';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('There was a problem with your login.');
            });
        });
    
        // Toggle password visibility function
        function togglePasswordVisibility() {
            const passwordField = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
    
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordField.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }
    </script>
    
</body>
</html>
