<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professor Login - Event Management Portal</title>
    <link rel="stylesheet" href="prof.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> <!-- Font Awesome for icons -->
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="logo">
                <img src="logo.png" alt="Event Management Logo">
            </div>
            <h2>Welcome!</h2>
            <p>Professor Account</p>
            <form id="loginForm">
                <div class="input-group">
                    <i class="fas fa-envelope"></i> <!-- Email Icon -->
                    <input type="email" id="email" name="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i> <!-- Password Icon -->
                    <input type="password" id="password" name="password" placeholder="Password" required>
                    <button type="button" id="togglePassword" onclick="togglePasswordVisibility()">
                        <i class="fas fa-eye" id="eyeIcon"></i> <!-- Eye Icon for toggling -->
                    </button>
                </div>
                <div class="actions">
                    <button type="submit" class="btn">Login</button>
                </div>
                <p class="register-link">Don't have an account? <a href="profsignup.html">Sign up here</a></p>
                <p class="forgot-password-link"><a href="../forgotprofpassword.html">Forgot Password?</a></p>
            </form>
        </div>
    </div>

    <script>
        // Listen for the form submission
        document.getElementById('loginForm').addEventListener('submit', function (event) {
            event.preventDefault(); // Prevent default form submission

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Debug: Log form data to check
            console.log('Login form data:', { email, password });

            fetch('https://website-f9gk.onrender.com/proflogin', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(data.error); // Show error message
                } else {
                    // Save token and fullname in localStorage
                    localStorage.setItem('token', data.token); // Save the JWT
                    localStorage.setItem('fullname', data.fullname); // Save the professor's name

                    // Debug: Log success message and data
                    console.log('Login successful:', data.message);

                    // Redirect to the dashboard
                    window.location.href = 'prof-dashboard.html'; // Ensure the path is correct
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred while logging in. Please try again.');
            });
        });

        // Toggle password visibility function
        function togglePasswordVisibility() {
            const passwordField = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');

            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordField.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
