<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            margin: 0;
        }

        .main-content {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 100%;
            max-width: 1000px;
            position: relative;
            text-align: center;
        }

        .back-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #007BFF;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .back-button:hover {
            background-color: #0056b3;
        }

        .folder-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .folder {
            width: 120px;
            height: 100px;
            background-color: #FFD700;
            border: 2px solid #DAA520;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            position: relative;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            opacity: 0;
            animation: slideUp 0.5s forwards;
            MARGIN-BLOCK-END: 20PX;
        }

        /* Staggered animation effect */
        .folder:nth-child(1) {
            animation-delay: 0.1s;
        }
        .folder:nth-child(2) {
            animation-delay: 0.2s;
        }
        .folder:nth-child(3) {
            animation-delay: 0.3s;
        }
        .folder:nth-child(4) {
            animation-delay: 0.4s;
        }
        .folder:nth-child(5) {
            animation-delay: 0.5s;
        }
        .folder:nth-child(6) {
            animation-delay: 0.6s;
        }
        .folder:nth-child(7) {
            animation-delay: 0.7s;
        }
        .folder:nth-child(8) {
            animation-delay: 0.8s;
        }
        .folder:nth-child(9) {
            animation-delay: 0.9s;
        }
        .folder:nth-child(10) {
            animation-delay: 1s;
        }

        .folder:hover {
            transform: scale(1.1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .folder::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 10px;
            width: 50px;
            height: 20px;
            background-color: #FFD700;
            border-radius: 2px 2px 0 0;
            border: 2px solid #DAA520;
            border-bottom: none;
        }

        .folder-title {
            font-weight: bold;
            color: #333;
            margin-top: 25px;
        }

        button {
            background-color: #575757;
            color: white;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            display: none;
        }

        .folder:hover button {
            display: block;
        }

        button:hover {
            background-color: #3f3f3f;
        }

        /* Folder entrance animation */
        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <div class="main-content">
        <h2>Year and Section Pages</h2>
        <p>Click on a folder to navigate to the corresponding page.</p>

        <!-- Folder Container -->
        <div class="folder-container">
            <div class="folder" onclick="loadSectionPage('1styrsections/BSIT-3A.html')">
                <div class="folder-title">BSIT - 3A</div>
                <button>Open</button>
            </div>
            <div class="folder" onclick="loadSectionPage('1styrsections/BSIT-3B.html')">
                <div class="folder-title">BSIT - 3B</div>
                <button>Open</button>
            </div>
            <div class="folder" onclick="loadSectionPage('1styrsections/BSIT-3C.html')">
                <div class="folder-title">BSIT - 3C</div>
                <button>Open</button>
            </div>
            <div class="folder" onclick="loadSectionPage('1styrsections/BSIT-3D.html')">
                <div class="folder-title">BSIT - 3D</div>
                <button>Open</button>
            </div>
            <div class="folder" onclick="loadSectionPage('1styrsections/BSIT-3E.html')">
                <div class="folder-title">BSIT - 3E</div>
                <button>Open</button>
            </div>
            <div class="folder" onclick="loadSectionPage('1styrsections/BSIT-3F.html')">
                <div class="folder-title">BSIT - 3F</div>
                <button>Open</button>
            </div>
            <div class="folder" onclick="loadSectionPage('1styrsections/BSIT-3G.html')">
                <div class="folder-title">BSIT - 3G</div>
                <button>Open</button>
            </div>
            <div class="folder" onclick="loadSectionPage('1styrsections/BSIT-3H.html')">
                <div class="folder-title">BSIT - 3H</div>
                <button>Open</button>
            </div>
            <div class="folder" onclick="loadSectionPage('1styrsections/BSIT-3I.html')">
                <div class="folder-title">BSIT - 3I</div>
                <button>Open</button>
            </div>
            <div class="folder" onclick="loadSectionPage('1styrsections/BSIT-3J.html')">
                <div class="folder-title">BSIT - 3J</div>
                <button>Open</button>
            </div>
        </div>

        <!-- Placeholder for loading section pages -->
        <div id="yearPage"></div>
    </div>

    <script>
        function loadSectionPage(section) {
            const iframe = document.createElement('iframe');
            iframe.src = section;
            iframe.width = "100%";
            iframe.height = "500px";
            document.getElementById('yearPage').innerHTML = ""; // Clear previous content
            document.getElementById('yearPage').appendChild(iframe);
        }
    </script>
</body>
</html>
