<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Event Management Portal</title>
    <link rel="stylesheet" href="login.css">
    <style>
        /* General Styles */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to right, #f5f7f8, #0083b0);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Login Wrapper to Center Content */
        .login-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Login Container Styling */
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 40px 50px;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Logo Styling */
        .logo img {
            max-width: 100px;
            margin-bottom: 20px;
        }

        /* Heading and Paragraph */
        h2 {
            margin-bottom: 10px;
            color: #333;
            font-size: 24px;
        }

        p {
            margin-bottom: 30px;
            color: #666;
        }

        /* Input Group Styling */
        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            background: #f7f7f7;
            border: none;
            border-radius: 30px;
            box-shadow: inset 0 5px 10px rgba(0, 0, 0, 0.1);
            font-size: 16px;
            color: #333;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            background: #eef1f5;
            box-shadow: inset 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        /* Button Styling */
        .actions .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to right, #00b4db, #0083b0);
            color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .actions .btn:hover {
            background: linear-gradient(to right, #0083b0, #00b4db);
        }

        /* Back to Login Link Styling */
        .back-to-login {
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .back-to-login a {
            color: #00b4db;
            text-decoration: none;
            font-weight: bold;
        }

        .back-to-login a:hover {
            text-decoration: underline;
        }

        /* Add a Subtle Animation */
        .login-container::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -100%;
            left: -100%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2), transparent);
            animation: rotate 5s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <div class="logo">
                <img src="logo.png" alt="Event Management Logo">
            </div>
            <h2>Forgot Password?</h2>
            <p>Please enter your email address to receive password reset instructions.</p>
            <form id="forgotPasswordForm">
                <div class="input-group">
                    <input type="email" id="email" name="email" placeholder="Email" required>
                </div>
                <div class="actions">
                    <button type="submit" class="btn">Send Reset Link</button>
                </div>
                <p class="back-to-login">Remembered your password? <a href="login.html">Back to Login</a></p>
            </form>
        </div>
    </div>

    <script>
        async function handleForgotPassword(event) {
            event.preventDefault();
            const email = document.getElementById('email').value; // Corrected ID to match your input field

            try {
                const response = await fetch('http://localhost:3001/forgot-profpassword', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email }),
                });

                // Check if the response is OK (status code 200-299)
                if (!response.ok) {
                    const errorData = await response.json(); // Handle error response
                    throw new Error(errorData.error || 'Something went wrong'); // Create an error from the response
                }

                const data = await response.json(); // Parse the response as JSON
                alert(data.message); // Show the success message
            } catch (error) {
                console.error('Error:', error);
                alert('Error: ' + error.message); // Show the error message
            }
        }

        // Attach event listener for form submission
        document.getElementById('forgotPasswordForm').addEventListener('submit', handleForgotPassword);
    </script>
</body>
</html>
