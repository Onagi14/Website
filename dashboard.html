<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* Basic reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 250px;
            position: fixed;
            height: 100%;
            background-color: #2c3e50;
            color: white;
            padding-top: 20px;
            font-family: Arial, sans-serif;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .sidebar a {
            display: block;
            padding: 15px;
            color: white;
            text-decoration: none;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .sidebar a:hover, .sidebar .active {
            background-color: #3498db;
        }

        /* Main Content Styles */
        .main-content {
            margin-left: 260px;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        /* Event Form Styles */
        .upcoming_event {
            max-width: 600px;
            margin: 0 auto;
        }

        .upcoming_event h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        /* Form Group Styles */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .form-group input[type="text"],
        .form-group textarea,
        .form-group input[type="file"] {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
        }

        .form-group textarea {
            resize: vertical;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #2980b9;
        }

        /* Responsive Styling */
        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }

            .main-content {
                margin-left: 210px;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <h2>Event Portal</h2>
        <a href="dashboard.html">Dashboard Overview</a>
        <a href="Event_management.html">Event Creation</a>
        <a href="upcoming_event.html">Create Upcoming Events</a>
        <a href="eventREgistration.html">Event Registration Management</a>
        <a href="attendance.html">Manage Reminders</a>
        <a href="#" onclick="logout()">Logout</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="dashboard-section">
            <h2>Dashboard Overview</h2>
            <div class="stat-box">
                <h3>Upcoming Events</h3>
                <p>5</p>
            </div>
            <div class="stat-box">
                <h3>Ongoing Events</h3>
                <p>2</p>
            </div>
            <div class="stat-box">
                <h3>Past Events</h3>
                <p>12</p>
            </div>

            <!-- Quick Access Buttons -->
            <div class="button-group">
                <button onclick="window.location.href='Event_management.html'">Create New Event</button>
                <button onclick="window.location.href='eventREgistration.html'">Manage Events</button>
            </div>

            <!-- Month Selection Dropdowns -->
            <label for="startMonthSelect">Start Month:</label>
            <select id="startMonthSelect">
                <option value="January">January</option>
                <option value="February">February</option>
                <option value="March">March</option>
                <option value="April">April</option>
                <option value="May">May</option>
                <option value="June">June</option>
                <option value="July">July</option>
                <option value="August">August</option>
                <option value="September">September</option>
                <option value="October">October</option>
                <option value="November">November</option>
                <option value="December">December</option>
            </select>

            <label for="endMonthSelect">End Month:</label>
            <select id="endMonthSelect">
                <option value="January">January</option>
                <option value="February">February</option>
                <option value="March">March</option>
                <option value="April">April</option>
                <option value="May">May</option>
                <option value="June">June</option>
                <option value="July">July</option>
                <option value="August">August</option>
                <option value="September">September</option>
                <option value="October">October</option>
                <option value="November">November</option>
                <option value="December">December</option>
            </select>

            <button id="updateChartButton">Update Chart</button>

            <!-- Bar Graph Section -->
            <div>
                <h3 id="monthIndicator">Registration Percentage per Event (January - February)</h3>
                <canvas id="registrationChart" width="400" height="200"></canvas>
            </div>
        </div>
    </div>

    <script>
      window.onload = function() {
        // Check if the user is logged in by verifying the token in localStorage
        const token = localStorage.getItem('token');
        
        if (!token) {
            // If no token is found, redirect to login page
            window.location.href = 'adminlogin.html';
        } else {
            // Optionally, you can verify the token here by making a request to your backend
            // If the token is invalid, you can force a redirect back to login page

            fetch('https://website-f9gk.onrender.com/verify-token', {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(response => {
                if (!response.ok) {
                    alert('You need login first.')
                    window.location.href = 'adminlogin.html';
                }
            })
            .catch(error => {
                // If there's an error with the token verification request, handle it gracefully
                console.error("Error verifying token:", error);
                window.location.href = 'adminlogin.html';
            });
        }


        
    
            const ctx = document.getElementById('registrationChart').getContext('2d');
            let registrationChart;
    
            // Function to update the chart based on selected months
            async function updateChart(startMonth, endMonth) {
                const monthOrder = [
                    'January', 'February', 'March', 'April', 'May', 
                    'June', 'July', 'August', 'September', 
                    'October', 'November', 'December'
                ];
    
                const startIndex = monthOrder.indexOf(startMonth);
                const endIndex = monthOrder.indexOf(endMonth);
    
                if (startIndex === -1 || endIndex === -1) {
                    alert("Invalid month selected. Please try again.");
                    return;
                }
    
                try {
                    const response = await fetch(`https://website-f9gk.onrender.com/api/attendees-by-month?startMonth=${startMonth}&endMonth=${endMonth}`, {
                        headers: {
                            'Authorization': `Bearer ${token}` // Send token for authentication
                        }
                    });
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
    
                    const { attendees } = await response.json();
    
                    if (!attendees || attendees.length === 0) {
                        alert("No attendees found for the selected months.");
                        return;
                    }
    
                    const eventAttendance = attendees.reduce((acc, attendee) => {
                        acc[attendee._id] = attendee.registered;
                        return acc;
                    }, {});
    
                    const labels = Object.keys(eventAttendance);
                    const data = Object.values(eventAttendance).map(registered => (registered / 100) * 100); // Example percentage calc
    
                    if (registrationChart) {
                        registrationChart.destroy();
                    }
    
                    registrationChart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels,
                            datasets: [{
                                label: 'Registration Percentage',
                                data,
                                backgroundColor: 'rgba(0, 123, 255, 0.6)',
                                borderColor: 'rgba(0, 123, 255, 1)',
                                borderWidth: 1
                            }]
                        },
                        options: {
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    max: 100,
                                    ticks: {
                                        callback: value => value + '%'
                                    }
                                }
                            }
                        }
                    });
    
                    document.getElementById('monthIndicator').innerText = `Registration Percentage per Event (${startMonth} - ${endMonth})`;
    
                } catch (error) {
                    console.error("Error fetching attendee data:", error);
                    alert("No attendees found on selected months.");
                }
            }
    
            // Determine the current month and set the dropdowns
            const now = new Date();
            const currentMonthIndex = now.getMonth(); // 0 = January, 11 = December
            const currentMonth = new Intl.DateTimeFormat('en-US', { month: 'long' }).format(now);
    
            // Set the dropdowns to the current month
            document.getElementById('startMonthSelect').value = currentMonth;
            document.getElementById('endMonthSelect').value = currentMonth;
    
            // Initial chart load for the current month
            updateChart(currentMonth, currentMonth);
    
            // Event listener for the update button
            document.getElementById('updateChartButton').addEventListener('click', function() {
                const startMonth = document.getElementById('startMonthSelect').value;
                const endMonth = document.getElementById('endMonthSelect').value;
                updateChart(startMonth, endMonth);
            });
        }


        function logout() {
        localStorage.removeItem('token');
        window.location.href = 'adminlogin.html';
    }
    </script>
    
</body>
</html>
