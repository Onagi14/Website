<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upcoming Events</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* Basic reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 250px;
            position: fixed;
            height: 100%;
            background-color: #2c3e50;
            color: white;
            padding-top: 20px;
            font-family: Arial, sans-serif;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .sidebar a {
            display: block;
            padding: 15px;
            color: white;
            text-decoration: none;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .sidebar a:hover, .sidebar .active {
            background-color: #3498db;
        }

        /* Main Content Styles */
        .main-content {
            margin-left: 260px;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        /* Event Form Styles */
        .upcoming_event {
            max-width: 600px;
            margin: 0 auto;
        }

        .upcoming_event h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        /* Form Group Styles */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .form-group input[type="text"],
        .form-group textarea,
        .form-group input[type="file"] {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
        }

        .form-group textarea {
            resize: vertical;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #2980b9;
        }

        /* Responsive Styling */
        /* Small screens (phones) */
        @media (max-width: 600px) {
            .sidebar {
                width: 200px;
            }

            .main-content {
                margin-left: 210px;
            }

            .upcoming_event {
                max-width: 100%;
                padding: 10px;
            }

            .sidebar a {
                font-size: 14px;
                padding: 10px;
            }

            .submit-btn {
                font-size: 14px;
                padding: 10px;
            }
        }

        /* Medium screens (tablets) */
        @media (min-width: 601px) and (max-width: 1024px) {
            .sidebar {
                width: 220px;
            }

            .main-content {
                margin-left: 230px;
            }

            .upcoming_event {
                max-width: 80%;
            }

            .sidebar a {
                font-size: 15px;
            }

            .submit-btn {
                font-size: 15px;
            }
        }

        /* Large screens (laptops/desktops) */
        @media (min-width: 1025px) {
            .sidebar {
                width: 250px;
            }

            .main-content {
                margin-left: 260px;
            }

            .upcoming_event {
                max-width: 600px;
            }
        }

    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <h2>Event Portal</h2>
        <a href="dashboard.html">Dashboard Overview</a>
        <a href="Event_management.html">Event Creation</a>
        <a href="upcoming_event.html">Create Upcoming Events</a>
        <a href="eventREgistration.html">Event Registration Management</a>
        <a href="attendance.html">Manage Reminders</a>
        <a href="#" onclick="logout()">Logout</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="upcoming_event">
            <h2>Create Upcoming Event</h2>

            <!-- Event Post Form -->
            <form id="event-form" enctype="multipart/form-data" class="event-form">
                <div class="form-group">
                    <label for="event-title">Event Title</label>
                    <input type="text" id="event-title" name="eventTitle" placeholder="Enter event title" required>
                </div>
            
                <div class="form-group">
                    <label for="event-description">Event Description</label>
                    <textarea id="event-description" name="eventDescription" rows="4" placeholder="Enter event description" required></textarea>
                </div>
            
                <!-- Add Event Date Field -->
                <div class="form-group">
                    <label for="event-date">Event Date</label>
                    <input type="date" id="event-date" name="eventDate" required>
                </div>
            
                <!-- Add Event Time Field -->
                <div class="form-group">
                    <label for="event-time">Event Time</label>
                    <input type="time" id="event-time" name="eventTime" required>
                </div>
            
                <!-- Add Event Location Field -->
                <div class="form-group">
                    <label for="event-location">Event Location</label>
                    <input type="text" id="event-location" name="eventLocation" placeholder="Enter event location" required>
                </div>
            
                <!-- Event Image Upload -->
                <div class="form-group">
                    <label for="event-image">Add Image</label>
                    <input type="file" id="event-image" name="eventImage" accept="image/*" required>
                </div>
            
                <button type="submit" class="submit-btn">Create Event</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("event-form").addEventListener("submit", async function (e) {
            e.preventDefault();

            const formData = new FormData();
            formData.append("eventTitle", document.getElementById("event-title").value);
            formData.append("eventDescription", document.getElementById("event-description").value);
            formData.append("eventDate", document.getElementById("event-date").value);
            formData.append("eventTime", document.getElementById("event-time").value);
            formData.append("eventLocation", document.getElementById("event-location").value);
            formData.append("eventImage", document.getElementById("event-image").files[0]);

            try {
                const response = await fetch('https://website-f9gk.onrender.com/api/create-event', {
                    method: 'POST',
                    body: formData,
                });

                if (response.ok) {
                    alert('Event created successfully!');
                    window.location.href = 'upcoming_event.html';
                } else {
                    alert('Failed to create event');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error occurred while creating the event');
            }
        });

        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'adminlogin.html';
        }

        window.onload = function() {
            const token = localStorage.getItem('token');
            if (!token) {
                alert('You need login first.');
                window.location.href = 'adminlogin.html';
            } else {
                fetch('https://website-f9gk.onrender.com/verify-token', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                })
                .then(response => {
                    if (!response.ok) {
                        alert('You need login first.');
                        window.location.href = 'adminlogin.html';
                    }
                })
                .catch(error => {
                    console.error("Error verifying token:", error);
                    window.location.href = 'adminlogin.html';
                });
            }
        }
    </script>

</body>
</html>
