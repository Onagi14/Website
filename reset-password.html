    <!-- reset-password.html -->
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Reset Password</title>
        <style>
            /* Add your CSS styles here */
            body {
                font-family: Arial, sans-serif;
                background: linear-gradient(to right, #f5f7f8, #0083b0);
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
            }
            .container {
                background-color: white;
                padding: 20px;
                border-radius: 5px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
                width: 300px;
            }
            h2 {
                text-align: center;
            }
            input[type="password"] {
                width: 100%;
                padding: 10px;
                margin: 10px 0;
                border: 1px solid #ccc;
                border-radius: 5px;
            }
            button {
                width: 100%;
                padding: 10px;
                background-color: #007bff;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }
            button:hover {
                background-color: #0056b3;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h2>Reset Your Password</h2>
            <form id="resetPasswordForm">
                <input type="hidden" id="token" name="token">
                <input type="hidden" id="email" name="email">
                <div>
                    <input type="password" id="newPassword" name="newPassword" placeholder="New Password" required>
                </div>
                <div>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required>
                </div>
                <button type="submit">Reset Password</button>
            </form>
        </div>

        <script>
            // Parse URL parameters to get token and email
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const email = urlParams.get('email');

            // Set token and email in hidden inputs
            document.getElementById('token').value = token;
            document.getElementById('email').value = email;

            document.getElementById('resetPasswordForm').addEventListener('submit', function (event) {
                event.preventDefault();

                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (newPassword !== confirmPassword) {
                    alert("Passwords do not match!");
                    return;
                }

                fetch('https://website-i6to.onrender.com/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        token,
                        email,
                        newPassword,
                    }),
                })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        alert(data.error);
                    } else {
                        alert('Password reset successfully! You can now log in.');
                        window.location.href = 'login.html '; // Redirect to login page
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('There was an error resetting your password.');
                });
            });
        </script>
    </body>
    </html>
